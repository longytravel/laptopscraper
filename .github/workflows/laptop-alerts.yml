name: Laptop best-buy alerts

on:
  workflow_dispatch:
  schedule:
    # The eBay Browse quota resets at 07:00 UTC, which is 08:00 Europe/London in
    # summer. Starting exactly on that boundary raced the reset, so both the
    # morning and evening runs sit clear of it.
    - cron: '30 8 * * *'
      timezone: 'Europe/London'
    - cron: '30 20 * * *'
      timezone: 'Europe/London'

concurrency:
  group: laptop-best-buy-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The widened search collects several times more listings than it used to,
    # so the old 45 minutes no longer covered a full refresh. The AI step is
    # separately capped per run, which is what actually bounds the duration.
    timeout-minutes: 90
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_GB
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      LAPTOP_DASHBOARD_URL: https://laptopscraper.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore listing evidence cache
        uses: actions/cache@v4
        with:
          path: .cache/laptop-ai-enrichment.json
          key: laptop-ai-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            laptop-ai-${{ runner.os }}-

      - run: npm run refresh:laptop-alerts

      - name: Check whether collection is fresh
        id: freshness
        run: node -e "const fs=require('node:fs');const data=require('./public/data/laptop-listings.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'fresh='+(data.refreshStatus!=='cached-fallback')+'\n')"

      - run: npm test
      - run: npm run lint
      - run: npm run build

      # Vercel deploys this project straight from its GitHub integration, so the
      # commit at the end of this job publishes the dashboard on its own. The CLI
      # deploy that used to sit here needed a VERCEL_TOKEN that has since expired,
      # and its failure was the only thing marking otherwise healthy runs as red.

      - name: Send digest after publication
        if: steps.freshness.outputs.fresh == 'true'
        run: npm run alerts:laptops

      - name: Persist successful snapshot and alert state
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/laptop-listings.json data/laptop-benchmark-evidence.json data/laptop-alert-state.json
          git diff --cached --quiet || git commit -m "chore: refresh laptop alerts"
          git push

      - name: Fail loudly on a preserved cached dataset
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          echo "::error::eBay collection fell back to the cached dataset, so no dashboard update and no Telegram digest were produced. The usual cause is the shared eBay Browse quota (5,000 calls/day, resets 07:00 UTC) being exhausted by another application using the same EBAY_CLIENT_ID. Check https://developer.ebay.com/my/analytics for remaining calls."
          exit 1

      - name: Confirm the dashboard is serving this run's data
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          expected=$(node -p "require('./public/data/laptop-listings.json').generatedAt")
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS https://laptopscraper.vercel.app/data/laptop-listings.json | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).generatedAt" 2>/dev/null || echo none)
            if [ "$live" = "$expected" ]; then echo "Dashboard is serving $live"; exit 0; fi
            echo "Attempt $attempt: dashboard still on $live, waiting for the Vercel build."
            sleep 30
          done
          echo "::error::The dashboard is still not serving $expected after three minutes. The Telegram digest was sent. Check the Vercel GitHub integration is still connected to this repository."
          exit 1
